# Connection to your local PostgreSQL.
# The password is NOT stored here: dbt reads it from the PGPASSWORD
# environment variable, so this file is safe to commit to GitHub.
cdpr_hub:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('PGPASSWORD', '') }}"
      dbname: "{{ env_var('PGDATABASE', 'cdpr_hub') }}"
      schema: analytics
      threads: 4
