# Collects the current number of Steam players every hour
# and commits the new rows to this repository.

name: Collect Steam players

on:
  schedule:
    # Every hour at minute 17 (UTC). Not at minute 0, because GitHub is
    # busiest at the top of the hour and scheduled runs get delayed there.
    - cron: "17 * * * *"
  # Adds a "Run workflow" button in the Actions tab for manual runs.
  workflow_dispatch:

# Lets the workflow push commits back to the repository.
permissions:
  contents: write

# Never run two collections at the same time (they would conflict on push).
concurrency:
  group: collect-players
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # The newest state of main at the moment the job starts. Without this,
          # a run that waited in the queue checks out the older commit it was
          # triggered on, and its push then conflicts with the run before it.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect player counts
        run: python collector/collect_players.py

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "data: player counts $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Another commit may have landed meanwhile; rebase and retry a few times.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
